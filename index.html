<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MÍTICA - Hamburguesas Legendarias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              mitica: {
                yellow: '#FFC700', // Brand Yellow
                black: '#121212',
                darkGray: '#1E1E1E',
                lightGray: '#F3F3F3',
              }
            },
            fontFamily: {
              nexa: ['"Archivo Black"', 'sans-serif'], // Proxy for NexaRustSans
              rethink: ['"DM Sans"', 'sans-serif'], // Proxy for RethinkSans
            },
            backgroundImage: {
              'texture-noise': "url('https://www.transparenttextures.com/patterns/stardust.png')",
            }
          }
        }
      }
    </script>
    <!-- Loading Google Fonts as proxies for the requested local fonts since we can't upload files -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:opsz,wght@9..40,400;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'DM Sans', sans-serif;
        background-color: #ffffff;
        overflow-x: hidden;
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #121212; 
      }
      ::-webkit-scrollbar-thumb {
        background: #FFC700; 
        border-radius: 4px;
      }

      /* Text Stroke Utility */
      .text-stroke-black {
        -webkit-text-stroke: 2px black;
        color: transparent;
      }
      .text-stroke-yellow {
        -webkit-text-stroke: 2px #FFC700;
        color: transparent;
      }
      .text-stroke-white {
        -webkit-text-stroke: 2px white;
        color: transparent;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "sanity": "https://aistudiocdn.com/sanity@^4.17.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
